name: Temporary Hadramout artwork source transfer
on:
  push:
    branches: [transfer/hadramout-artwork-2026-11-08]
    paths: ['.github/workflows/hadramout-artwork-export.yml']
permissions:
  contents: write
jobs:
  export-original-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transfer/hadramout-artwork-2026-11-08
      - name: Verify original Git blobs and split into transportable base64 text
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib, subprocess
          files = {
              "default_card": ("Hadramout_Cards/assets/default_card.png", "c1bcb76cf37d626e39bd65e72e45ddd2286f39bf"),
              "login_hero": ("Hadramout_Cards/assets/login_hero.png", "9c5fbc6117eeef514f78f4ac9a87dcb417e915f0"),
          }
          dest = pathlib.Path("artwork_transfer")
          dest.mkdir(exist_ok=True)
          for name, (path, expected) in files.items():
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==expected,(path,actual,expected)
              encoded=base64.b64encode(pathlib.Path(path).read_bytes()).decode("ascii")
              chunks=[encoded[i:i+320000] for i in range(0,len(encoded),320000)]
              for i,chunk in enumerate(chunks):
                  (dest/f"{name}.{i:02}.b64.txt").write_text(chunk,encoding="ascii")
              print(f"{name}: {len(chunks)} verified source chunks")
          PY
      - name: Commit temporary transfer payload only on the transfer branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artwork_transfer/
          git commit -m "transfer: stage byte-verified original Hadramout artwork chunks"
          git push origin HEAD:transfer/hadramout-artwork-2026-11-08
